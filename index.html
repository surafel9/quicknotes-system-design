<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QuickNotes - Lightweight note-taking client with real-time REST API integration and system design documentation.">
  <title>QuickNotes - API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="header-container">
      <h1>QuickNotes Client</h1>
      <p class="tagline">System Design Prototype &amp; REST API Client</p>
    </div>
  </header>

  <main class="app-main">
    <section class="panel control-panel" aria-labelledby="controls-heading">
      <h2 id="controls-heading">Notes Control</h2>
      <button type="button" id="load-btn">Load notes</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="panel form-panel" aria-labelledby="create-heading">
      <h2 id="create-heading">Create a Note</h2>
      <form id="note-form" novalidate>
        <div class="form-group">
          <label for="title-input">Title <span class="required" aria-hidden="true">*</span></label>
          <input type="text" id="title-input" name="title" placeholder="Note title (required, max 100 characters)" maxlength="100" required>
          <small class="char-hint">Maximum 100 characters</small>
        </div>

        <div class="form-group">
          <label for="body-input">Body</label>
          <textarea id="body-input" name="body" rows="4" placeholder="Write your note content here (optional)"></textarea>
        </div>

        <button type="submit" id="submit-btn">Add Note</button>
      </form>
    </section>

    <section class="panel list-panel" aria-labelledby="notes-heading">
      <div class="list-header">
        <h2 id="notes-heading">Server Notes</h2>
      </div>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer class="app-footer">
    <p>QuickNotes System Design &bull; Connected to JSONPlaceholder API</p>
  </footer>
</body>
</html>
